<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <center>
        
        <h1>Aquatic Beats Party</h1>

        <h2>The ocean is large</h2>

            <source src="Ocean.Mp3" type="audio/mpeg">

        </video>

        <h2>The ocean show is live!</h2>

        <p>This webpage uses the audio tag for music and the video tag for the ocean show.</p>
        
        </center>
